[project]
name = "visual-qc-workshop"
version = "0.1.0"
description = "AI-assisted visual quality inspection laboratory"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
